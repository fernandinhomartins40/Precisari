# Host nginx: /etc/nginx/sites-available/precisari (applied by hand, nginx is shared with other projects).
server {
    listen 80;
    server_name www.precisari.com.br precisari.com.br api.precisari.com.br;
    location /.well-known/acme-challenge/ { root /var/www/precisari; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name precisari.com.br;
    ssl_certificate /etc/letsencrypt/live/precisari.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/precisari.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.precisari.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.precisari.com.br;
    ssl_certificate /etc/letsencrypt/live/precisari.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/precisari.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name api.precisari.com.br;
    ssl_certificate /etc/letsencrypt/live/precisari.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/precisari.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
