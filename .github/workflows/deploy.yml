name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# No cancel-in-progress: cancelling mid-deploy could interrupt a database migration.
concurrency:
  group: deploy-precisari
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/fernandinhomartins40/precisari-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/fernandinhomartins40/precisari-${{ matrix.target }}:buildcache
          cache-to: type=registry,ref=ghcr.io/fernandinhomartins40/precisari-${{ matrix.target }}:buildcache,mode=max
          provenance: false
          sbom: false
          # NEXT_PUBLIC_* are inlined at build time by Next.js.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.precisari.com.br

  # GitHub-hosted, not self-hosted: this repo is public and a self-hosted runner would run on the
  # shared VPS. The SSH key is restricted on the server to the deploy command (deploy/ssh-entry.sh).
  deploy:
    needs: [ci, build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes root@72.60.10.108 "$GITHUB_SHA"
