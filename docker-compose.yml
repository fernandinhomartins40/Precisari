services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: precisari
      POSTGRES_PASSWORD: precisari
      POSTGRES_DB: precisari
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precisari"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
